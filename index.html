<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WanPE Video Demos — Anonymous Supplementary Material</title>
  <meta name="description" content="Anonymous video demonstrations for WanPE.">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="demo-only-page">
  <main class="content demo-content">
    <section id="demos" class="section-card demo-page">
      <header class="demo-page-header">
        <div class="hero-badge">Anonymous supplementary material</div>
        <h1>WanPE Video Demos</h1>
      </header>

      <div class="sound-tip" role="note">
        <span class="sound-tip-icon" aria-hidden="true">🔊</span>
        <span><strong>For the best experience, turn on sound</strong> using the player controls.</span>
      </div>

      <div class="speed-controls" role="group" aria-label="Playback speed">
        <span class="speed-label">Play speed</span>
        <button class="speed-btn active" data-speed="1" type="button">x1</button>
        <button class="speed-btn" data-speed="2" type="button">x2</button>
      </div>
      <div id="demo-list"></div>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
